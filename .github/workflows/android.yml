name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_DOWNLOAD_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
  TEMPLATES_DOWNLOAD_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
  EXPORT_PRESET_ANDROID: "Android"
  EXPORT_PRESET_AAB: "Android AAB (Play Store)"
  BUILD_DIR: "build"

jobs:
  build-apk-debug:
    name: Build APK (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot and export APK (Debug)
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: ${{ env.GODOT_DOWNLOAD_URL }}
          godot_export_templates_download_url: ${{ env.TEMPLATES_DOWNLOAD_URL }}
          relative_project_path: ./
          presets_to_export: ${{ env.EXPORT_PRESET_ANDROID }}
          relative_export_path: ${{ env.BUILD_DIR }}/NigerStreets-debug.apk
          export_debug: true
          cache: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NigerStreets-debug-apk
          path: ${{ env.BUILD_DIR }}/NigerStreets-debug.apk
          retention-days: 30

  build-aab-release:
    name: Build AAB (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    env:
      GODOT_ANDROID_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      GODOT_ANDROID_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      GODOT_ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      GODOT_ANDROID_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot and export AAB (Release)
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: ${{ env.GODOT_DOWNLOAD_URL }}
          godot_export_templates_download_url: ${{ env.TEMPLATES_DOWNLOAD_URL }}
          relative_project_path: ./
          presets_to_export: ${{ env.EXPORT_PRESET_AAB }}
          relative_export_path: ${{ env.BUILD_DIR }}/NigerStreets-release.aab
          export_debug: false
          cache: true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NigerStreets-release-aab
          path: ${{ env.BUILD_DIR }}/NigerStreets-release.aab
          retention-days: 90

      - name: Upload AAB to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.BUILD_DIR }}/NigerStreets-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-apk-release:
    name: Build APK (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    env:
      GODOT_ANDROID_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
      GODOT_ANDROID_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
      GODOT_ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      GODOT_ANDROID_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot and export APK (Release)
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: ${{ env.GODOT_DOWNLOAD_URL }}
          godot_export_templates_download_url: ${{ env.TEMPLATES_DOWNLOAD_URL }}
          relative_project_path: ./
          presets_to_export: ${{ env.EXPORT_PRESET_ANDROID }}
          relative_export_path: ${{ env.BUILD_DIR }}/NigerStreets-release.apk
          export_debug: false
          cache: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NigerStreets-release-apk
          path: ${{ env.BUILD_DIR }}/NigerStreets-release.apk
          retention-days: 90

      - name: Upload APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.BUILD_DIR }}/NigerStreets-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}