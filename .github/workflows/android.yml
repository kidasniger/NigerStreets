name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Construire aussi l'AAB signé (Play Store)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nigerstreets-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_DOWNLOAD_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
  TEMPLATES_DOWNLOAD_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
  EXPORT_PRESET_ANDROID: "Android"
  BUILD_DIR: "build"

jobs:
  build:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Decode release keystore
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Extract Version Info
        id: version_info
        run: |
          BASE_VERSION=$(grep 'version/name=' export_presets.cfg | head -n 1 | sed -E 's/^version\/name="?([^"]+)"?$/\1/')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0"
          fi
          VERSION_NAME="$BASE_VERSION-b${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          TAG_NAME="v$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Notes
        id: release_notes
        shell: bash
        run: |
          # Corps du dernier commit « feature » pour les notes de release ; les commits
          # de correction CI sont ignorés pour ne pas masquer les changements utilisateur.
          NOTES=$(git log -1 --invert-match --grep='^Correction CI' --pretty=format:'%b' | sed '/^[[:space:]]*$/d')
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --pretty=format:'%s')
          fi
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Bump versionCode/Name (presets + project.godot)
        run: |
          sed -i -E "s|^version/code=[0-9]+|version/code=${{ steps.version_info.outputs.version_code }}|" export_presets.cfg
          sed -i -E "s|^version/name=\"[^\"]*\"|version/name=\"${{ steps.version_info.outputs.version_name }}\"|" export_presets.cfg
          sed -i -E "s|^config/version=\"[^\"]*\"|config/version=\"${{ steps.version_info.outputs.version_name }}\"|" project.godot
          grep -n '^version/' export_presets.cfg
          grep -n '^config/version' project.godot

      - name: Select JDK for Gradle
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          else
            echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")" >> "$GITHUB_ENV"
          fi

      - name: Install Android build template + plugin UpdateInstaller
        run: |
          set -o pipefail
          TPZ="$RUNNER_TEMP/templates.tpz"
          URL="${{ env.TEMPLATES_DOWNLOAD_URL }}"
          if ! wget -c -q --tries=5 --timeout=90 -O "$TPZ" "$URL"; then
            echo "wget a échoué, tentative avec curl (reprise + retries)"
            curl -L --fail --retry 5 --retry-all-errors -C - -o "$TPZ" "$URL"
          fi
          unzip -o "$TPZ" 'templates/android_source.zip' -d "$RUNNER_TEMP"
          mkdir -p android/build
          unzip -o "$RUNNER_TEMP/templates/android_source.zip" -d android/build
          bash scripts/setup_android_plugin.sh

      - name: Setup Godot and export APK (Release)
        uses: firebelley/godot-export@v6.0.0
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        with:
          godot_executable_download_url: ${{ env.GODOT_DOWNLOAD_URL }}
          godot_export_templates_download_url: ${{ env.TEMPLATES_DOWNLOAD_URL }}
          relative_project_path: ./
          presets_to_export: ${{ env.EXPORT_PRESET_ANDROID }}
          relative_export_path: ${{ env.BUILD_DIR }}/NigerStreets-release.apk
          export_debug: false
          cache: true

      - name: Rename APK
        run: |
          mkdir -p build_output
          APK_FILE=$(find ${{ env.BUILD_DIR }} -type f -name '*.apk' | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Aucun .apk trouvé sous ${{ env.BUILD_DIR }} — contenu :"
            find ${{ env.BUILD_DIR }} -type f | head -30
            exit 1
          fi
          echo "APK exporté trouvé : $APK_FILE"
          cp "$APK_FILE" "build_output/NigerStreets-${{ steps.version_info.outputs.tag_name }}.apk"
          ls -lh build_output

      - name: Install Android build template (AAB uniquement)
        if: github.event.inputs.build_aab == 'true'
        run: |
          bash scripts/setup_android_plugin.sh

      - name: Select JDK for Gradle (AAB uniquement)
        if: github.event.inputs.build_aab == 'true'
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
          else
            echo "JAVA_HOME=$(dirname "$(dirname "$(readlink -f "$(which javac)")")")" >> "$GITHUB_ENV"
          fi

      - name: Export AAB (Play Store)
        if: github.event.inputs.build_aab == 'true'
        uses: firebelley/godot-export@v6.0.0
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        with:
          godot_executable_download_url: ${{ env.GODOT_DOWNLOAD_URL }}
          godot_export_templates_download_url: ${{ env.TEMPLATES_DOWNLOAD_URL }}
          relative_project_path: ./
          presets_to_export: "Android AAB (Play Store)"
          relative_export_path: ${{ env.BUILD_DIR }}/NigerStreets.aab
          export_debug: false
          cache: true

      - name: Rename AAB
        if: github.event.inputs.build_aab == 'true'
        run: |
          AAB_FILE=$(find ${{ env.BUILD_DIR }} -type f -name '*.aab' | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Aucun .aab trouvé sous ${{ env.BUILD_DIR }} — contenu :"
            find ${{ env.BUILD_DIR }} -type f | head -30
            exit 1
          fi
          cp "$AAB_FILE" "build_output/NigerStreets-${{ steps.version_info.outputs.tag_name }}.aab"
          ls -lh build_output

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NigerStreets-release-apk
          path: build_output/*
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Release ${{ steps.version_info.outputs.tag_name }} (v${{ steps.version_info.outputs.version_name }})"
          body: |
            ### Mise à jour Niger Streets
            ${{ steps.release_notes.outputs.notes }}
          files: build_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "### Build + APK signé + Release + Tag automatiques" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fichier : NigerStreets-${{ steps.version_info.outputs.tag_name }}.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version : ${{ steps.version_info.outputs.version_name }} (code ${{ steps.version_info.outputs.version_code }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag : ${{ steps.version_info.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
